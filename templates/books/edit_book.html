<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #1f2d3d;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .main-container {
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            margin: 40px auto;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.07);
            flex-grow: 1;
        }

        h1 {
            color: #1f2d3d;
            font-size: 2em;
            margin-bottom: 20px;
        }

        /* Table Style */
        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        table td, table th {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #1f2d3d;
            color: white;
        }

        table input[type="text"], table input[type="number"], table textarea {
            padding: 8px;
            font-size: 1em;
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .form-container button {
            background-color: #1f2d3d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }

        .form-container button:hover {
            background-color: #304c61;
        }

        p {
            color: #333;
            font-size: 1.1em;
        }

        a {
            color: #1f2d3d;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            table input[type="text"], table input[type="number"], table textarea {
                width: 90%;
            }

            .form-container button {
                width: 90%;
            }
        }
        
        
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div><strong>🧩 MyBookApp</strong></div>
        <div>
            <a href="/dashboard">Profile</a>
            <a href="/books/list-view">View Books</a>
            <a href="/books/add">Add Book</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h1>Edit Book: {{ book.title }}</h1>

        <form action="/books/edit/{{ book.id }}" method="POST" enctype="multipart/form-data">
            <table>
                <tr>
                    <th>Title</th>
                    <td><input type="text" name="title" value="{{ book.title }}" placeholder="Enter book title" required></td>
                </tr>
                <tr>
                    <th>Author</th>
                    <td><input type="text" name="author" value="{{ book.author }}" placeholder="Enter author name" required></td>
                </tr>
                <tr>
                    <th>Description</th>
                    <td><textarea name="description" placeholder="Enter book description" required>{{ book.description }}</textarea></td>
                </tr>
                <tr>
                    <th>Price</th>
                    <td><input type="number" name="price" value="{{ book.price }}" placeholder="Enter price" required></td>
                </tr>
                <!-- Image Field -->
                <tr>
                    <th>Book Image</th>
                    <td>
                        <input type="file" name="image">
                        {% if book.image %}
                            <img src="{{ book.image }}" alt="Book Image" width="100" style="margin-top: 10px;">
                        {% endif %}
                    </td>
                </tr>
            </table>
            <button type="submit">Update Book</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 MyBookApp. All Rights Reserved.
    </footer>

</body>
</html>
