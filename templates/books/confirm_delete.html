<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #1f2d3d;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        h2 {
            color: #e74c3c;
            font-size: 2em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 10px;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div><strong>🧩 MyBookApp</strong></div>
    <div>
   
        <a href="/dashboard">Profile</a>
        <a href="/books/list-view">View Books</a>
        <a href="/books/add">Add Book</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    <h2>Are you sure?</h2>
    <p>Do you really want to delete the book "<strong>{{ book.title }}</strong>" by {{ book.author }}?</p>

    <form method="post" action="/books/{{ book.id }}/delete">
        <button class="btn btn-danger" type="submit">Yes, Delete</button>
        <a href="/books/list" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<!-- Footer -->
<footer>
    &copy; 2025 MyBookApp. All Rights Reserved.
</footer>

</body>
</html>
