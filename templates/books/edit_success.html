<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Update Successful</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #1f2d3d;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .main-container {
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            margin: 40px auto;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.07);
            flex-grow: 1;
        }

        h2 {
            color: #4CAF50;
            font-size: 2em;
            margin-bottom: 20px;
        }

        a {
            color: #1f2d3d;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1em;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95em;
        }

        @media (max-width: 600px) {
            h2 {
                font-size: 1.8em;
            }

            a {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div><strong>🧩 MyBookApp</strong></div>
        <div>
            <a href="/books">Books List</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h2>Book updated successfully!</h2>
        <a href="/books">Go to Books List</a>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 MyBookApp. All Rights Reserved.
    </footer>

</body>
</html>
