<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #1f2d3d;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .main-container {
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            margin: 40px auto;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.07);
            flex-grow: 1;
        }

        h1 {
            color: #1f2d3d;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .form-container {
            margin-top: 30px;
        }

        .form-container table {
            margin: 0 auto;
            text-align: left;
            width: 100%;
        }

        .form-container input[type="text"], .form-container input[type="number"], .form-container textarea, .form-container input[type="file"] {
            padding: 8px;
            font-size: 1em;
            width: 100%;
            max-width: 300px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .form-container input[type="submit"] {
            background-color: #1f2d3d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            width: 100%;
            max-width: 300px;
        }

        .form-container input[type="submit"]:hover {
            background-color: #304c61;
        }

        p {
            color: #333;
            font-size: 1.1em;
        }

        a {
            color: #1f2d3d;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .form-container input[type="text"], .form-container input[type="number"], .form-container textarea, .form-container input[type="file"] {
                width: 90%;
            }

            .form-container input[type="submit"] {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div><strong>🧩 MyBookApp</strong></div>
        <div>
            <a href="/dashboard">Profile</a>
            <a href="/books/list-view">View Books</a>
            <a href="/books/add">Add Book</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h1>📚 Add New Book</h1>

        <!-- Form to Add Book -->
        <div class="form-container">
            <form method="post" action="/books/add" enctype="multipart/form-data">
                <table cellpadding="8">
                    <tr>
                        <td>Book Title:</td>
                        <td><input type="text" name="title" required></td>
                    </tr>
                    <tr>
                        <td>Author:</td>
                        <td><input type="text" name="author" required></td>
                    </tr>
                    <tr>
                        <td>Description:</td>
                        <td><textarea name="description" rows="4" placeholder="Enter book description" required></textarea></td>
                    </tr>
                    <tr>
                        <td>Price:</td>
                        <td><input type="number" name="price" required></td>
                    </tr>
                    <tr>
                        <td>Book Image:</td>
                        <td><input type="file" name="image" accept="image/*" required></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" value="Add Book">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 MyBookApp. All Rights Reserved.
    </footer>

</body>
</html>
