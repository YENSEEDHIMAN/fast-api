<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #1f2d3d;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .main-container {
            padding: 20px;
            text-align: center;
            background-color: #ffffff;
            margin: 40px auto;
            max-width: 500px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.07);
            flex-grow: 1;
        }

        h1 {
            color: #1f2d3d;
            font-size: 2em;
            margin-bottom: 20px;
        }

        p {
            color: #333;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .links a {
            color: #1f2d3d;
            text-decoration: none;
            font-weight: 500;
            margin: 0 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 0.95em;
        }

        /* Image display */
        .book-image {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .main-container {
                padding: 15px;
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div><strong>🧩 MyBookApp</strong></div>
        <div>
            <a href="/dashboard">Profile</a>
            <a href="/books/list-view">View Books</a>
            <a href="/books/add">Add Book</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h1>{{ book.title }}</h1>
        <p><strong>Author:</strong> {{ book.author }}</p>
        <p><strong>Description:</strong> {{ book.description }}</p>
        <p><strong>Price:</strong> ${{ book.price }}</p>

        <!-- Display Book Image -->
        {% if book.image %}
            <img src="{{ book.image }}" alt="Book Image" class="book-image">
        {% else %}
            <p>No image available.</p>
        {% endif %}

        <!-- Links to Edit and Delete -->
        <div class="links">
            <a href="/books/{{ book.id }}/edit">Edit</a> | 
            <a href="/books/{{ book.id }}/delete">Delete</a>
        </div>

        <p><a href="/books">Back to Books List</a></p>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2025 MyBookApp. All Rights Reserved.
    </footer>

</body>
</html>
